name: Publish React Utilities

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-release"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --immutable --frozen-lockfile --ignore-engines

      - name: Run Tests
        run: yarn test

  publish:
    name: Publish to NPM
    needs: test
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --immutable --frozen-lockfile --ignore-engines

      - name: Run Build
        run: yarn build

      - name: Publish to NPM
        run: npm publish --provenance --access public
